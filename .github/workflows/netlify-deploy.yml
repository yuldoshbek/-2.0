name: Netlify Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NETLIFY_SITE_ID: 3758268a-51b5-4aef-9ca9-d8afe54a1bec
  NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate project
        run: npm run build

      - name: Deploy to Netlify
        if: env.NETLIFY_AUTH_TOKEN != ''
        run: npx netlify-cli deploy --prod --dir=public --functions=netlify/functions --site "$NETLIFY_SITE_ID" --message "GitHub Actions deploy $GITHUB_SHA"

      - name: Deployment not activated
        if: env.NETLIFY_AUTH_TOKEN == ''
        run: echo "NETLIFY_AUTH_TOKEN secret is not configured. Build passed, deploy skipped."
