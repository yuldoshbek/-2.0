<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Executive Control Center</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f3f6f8;
        color: #14202b;
        font-family: "Segoe UI", Arial, sans-serif;
      }
      main {
        width: min(720px, calc(100% - 32px));
        padding: 28px;
        border: 1px solid #d8e0e8;
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 14px 30px rgba(20, 32, 43, 0.08);
      }
      h1 {
        margin: 0 0 10px;
        font-size: 28px;
      }
      p {
        margin: 0 0 14px;
        color: #607080;
        line-height: 1.5;
      }
      code {
        display: inline-block;
        padding: 3px 6px;
        border-radius: 6px;
        background: #f3f6f8;
        color: #14202b;
      }
      a {
        color: #0f766e;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Executive Control Center</h1>
      <p>Это backend-проект. Запустите сервер командой <code>npm start</code>, затем откройте рабочую систему:</p>
      <p><a href="http://127.0.0.1:4173">http://127.0.0.1:4173</a></p>
    </main>
  </body>
</html>
